        geo = { w: vw, h: vh };
        return api;
      },
      destroy() { if (onResize) removeEventListener('resize', onResize); el.innerHTML = ''; }
    };
    if (opts.weeks) api.weeks(opts.weeks);
    if (opts.layout !== false) {
      api.layout(true);
      onResize = () => { clearTimeout(rT); rT = setTimeout(() => api.layout(false), 150); };
      addEventListener('resize', onResize);
    }
    return api;
  }

  /* بوصلة مصغّرة 32px: أربع علامات، الحالي مثلث في الأعلى */
  function mini(o) {
    o = o || {}; const cur = o.current || 1, rot = -(cur - 1) * 90;
    let m = '';
    for (let k = 1; k <= 4; k++) {
      const a = (k - 1) * 90 + rot, rad = a * Math.PI / 180, s = Math.sin(rad), c = -Math.cos(rad);
      if (k === cur) m += '<path class="wm now" d="M0 -15 L-3.6 -8.6 L3.6 -8.6 Z"/>';
      else m += `<circle class="wm${(o.done || []).includes(k) ? ' done' : ''}" cx="${f2(s * 11.5)}" cy="${f2(c * 11.5)}" r="2.4"/>`;
    }
    const lab = o.label ? ` role="img" aria-label="${String(o.label).replace(/"/g, '&quot;')}"` : ' aria-hidden="true"';
    return `<svg class="b-minidial" viewBox="-16 -16 32 32"${lab} focusable="false"><circle class="r" r="11.5"/>${m}</svg>`;
  }

  window.Bezel = { mount, mini, geometry, reduced: () => mq.matches, dialMarkup };
})();

قت محدد له قد يجعله أكثر انتظامًا."},"tryOut":{"p1":"اختر عملًا أو خدمة أو إجراءً في قطاعك ترى أنه يستحق التطوير، أو فرصة جديدة تستحق الاستكشاف.","p2":"جرّب أن تتخذ خطوة صغيرة هذا الأسبوع،","cap":"ساعة واحدة تكفي","p3":"ثم لاحظ:","i1":"ما الخطوة التي اتخذتها؟","i2":"ماذا اكتشفت أو تعلمت؟","i3":"ما الذي تحتاجه للانتقال إلى الخطوة التالية؟","closing":"ليس المطلوب أن تغيّر طريقة عملك بالكامل، بل أن تلاحظ أين يذهب وقتك، وما الذي يمكنك أن تفعله به."},"labels":{"resultK":"نتيجتك في هذا الأسبوع","sectorK":"عندما تحاول التطوير","tryK":"جرّب هذا الأسبوع","tryBtn":"جرّب هذا الأسبوع","next":"التالي","prev":"السابق","showResult":"عرض النتيجة","finish":"إنهاء"},"f":{}},W1I:{"title":"أين يذهب أسبوعك؟","intro":{"head":"تقويمك يتكلم","p1":"تقويمك يوضح كيف تقضي وقتك، وليس فقط كيف تخطط له.","p2":"قد تكون من أولوياتك تطوير العمل والتفكير في المستقبل، لكن مراجعة تقويمك قد تكشف لك أين يذهب معظم وقتك فعلًا، وما المساحة التي تمنحها لما يتجاوز متطلبات اليوم.","note1":"لا توجد إجابة صحيحة أو خاطئة.","note2":"الهدف أن تلاحظ نمطًا في أسبوعك قد لا تنتبه إليه وسط انشغالك اليومي.","hz":{"head":"قبل أن تبدأ: ثلاثة مسارات للأعمال","lead":"لفهم طريقة توزيع وقتك، تعرّف على ثلاثة أنواع من العمل:","exK":"أمثلة","h1":{"k":"المسار الأول","name":"إدارة الأعمال الحالية","def":"كل ما يرتبط بتشغيل الخدمات والمنتجات ومتابعة سير العمل ومعالجة المشكلات اليومية.","ex1":"متابعة أداء الخدمات والعمليات.","ex2":"معالجة المشكلات التشغيلية.","ex3":"متابعة الالتزامات والمهام القائمة.","ex4":"ضمان استمرارية العمل."},"h2":{"k":"المسار الثاني","name":"تطوير الأعمال الحالية","def":"كل ما يهدف إلى تحسين الخدمات والمنتجات والإجراءات القائمة ورفع كفاءتها.","ex1":"تحسين خطوات خدمة قائمة.","ex2":"معالجة أسباب مشكلة متكررة.","ex3":"تطوير إجراء لتقليل الوقت والجهد.","ex4":"تحسين تجربة المستفيد في خدمة حالية."},"h3":{"k":"المسار الثالث","name":"استكشاف فرص جديدة","def":"كل ما يتعلق بالبحث عن احتياجات وفرص جديدة قد تفتح مجالات عمل أو خدمات مختلفة.","ex1":"استكشاف احتياجات جديدة لدى المستفيدين.","ex2":"دراسة فرصة لتقديم خدمة جديدة. <script>
/* بوصلة القائد · الهيكل المشترك للموقع الحي (site/).

 *   state.animate   = هل يُسمح بالحركة (الزيارة الأولى فقط، ولا تقليل حركة)
 *   state.errors    = { pw, confirm, email, form } ← كل خطأ { text, contact:bool }

 * علامات مطلوبة في HTML التصميم (للفاحص الآلي):
 *   data-screen="<screen>" على جذر كل شاشة ظاهرة، data-primary على الزر الأساسي الظاهر،

(function () {

  function t(key, vars) {

  function leftText(n) { return n === 1 ? t('left.1') : n === 2 ? t('left.2') : t('left.n', { n }); }

    if (sec < 60) return t('time.min.0');
    if (m === 1) return t('time.min.1');

    if (m <= 10) return t('time.min.n', { n: m });

  /* ---------- التخزين التجريبي ---------- */
  function db() { try { return JSON.parse(localStorage.getItem(LS)) || {}; } catch (e) { return {}; } }

  async function call(action, body) {

      const j = await r.json(); if (!j.ok) { const e = new Error(j.error); Object.assign(e, { code: j.error }, j); throw e; }
      try { if (onResponse) onResponse(action, j, body); } catch (e) { console.error(e); }
      return j;
    }
    const e = new Error('server'); e.code = 'server'; throw e; // الموقع الحي لا يعمل بلا خادم (الوضع المحلي = mock.js)
  }

  /* ---------- الحالة ---------- */
  function set(patch, kind) {
    const from = S.screen;
    Object.assign(S, patch);
    if (patch.screen && patch.screen !== from) S.transition = { from, to: patch.screen, kind: kind || 'step' };
    else if (kind) S.transition = { from, to: S.screen, kind };
    S.animate = S.firstVisit && !reduced();
    try { render(Object.freeze(Object.assign({}, S, { errors: Object.assign({}, S.errors) }))); } catch (e) { console.error(e); }
    S.transition = { from: S.screen, to: S.screen, kind: 'none' };
  }
  function busy(on) {
    clearTimeout(spinTimer);
    if (on) { S.busy = true; S.spinner = false; spinTimer = setTimeout(() => set({ spinner: true }), 300); }
    else { S.busy = false; S.spinner = false; }
  }
  function startLock(sec) {
    clearInterval(lockTimer);
    const until = Date.now() + sec * 1000;
    const tick = () => { const s = Math.max(0, Math.round((until - Date.now()) / 1000));
      if (s <= 0) { clearInterval(lockTimer); set({ locked: false, lockSeconds: 0, attemptsLeft: 5, errors: {} }); return; }
      set({ locked: true, lockSeconds: s, errors: { form: { text: t('err.locked', { time: minutesText(s) }) } } }); };
    tick(); lockTimer = setInterval(tick, 1000);
  }
  async function run(action, body, ok, retry) {
    if (S.busy || (S.locked && /^login/.test(action))) return; // الإيقاف يمنع الدخول فقط، لا «نسيتها؟»
    busy(true); set({ offline: false });
    try { const r = await call(action, body); busy(false); queued = null; ok(r); }
    catch (e) {
      busy(false);
      if (e.code === 'offline' || e.name === 'TypeError') { queued = retry; set({ offline: true, errors: Object.assign({}, S.errors, { form: { text: t('err.offline') } }) }); return; }
      if (e.code === 'wrong') { set({ attemptsLeft: e.left, errors: { pw: { text: t('err.wrong', { left: leftText(e.left) }) } } }); return; }
      if (e.code === 'locked') { startLock(e.seconds); return; }
      if (e.code === 'noemail') { set({ errors: { email: { text: t('err.noEmail'), contact: true } } }); return; }
      if (e.code === 'badlink') { set({ screen: 'badlink', errors: { form: { text: t('err.badLink'), contact: true } } }); return; }
      if (e.code === 'expired') { set({ screen: 'expired', errors: {} }); return; }
      if (e.code === 'exists') { set({ screen: 'login', errors: {} }); return; }
      if (e.code === 'short') { set({ errors: { pw: { text: t(e.min >= 12 || S.resetAdmin ? 'err.shortAdmin' : 'err.short') } } }); return; }
      set({ errors: { form: { text: t('err.server') } } });
      console.error(e);
    }
  }
  window.addEventListener('online', () => { if (queued) { const q = queued; queued = null; q(); } });

  const validNew = (pw, confirm, admin) => {
    const er = {};
    if (!pw) er.pw = { text: t('err.empty') }; else if (pw.length < (admin ? 12 : 8)) er.pw = { text: t(admin ? 'err.shortAdmin' : 'err.short') };
    else if (confirm !== pw) er.confirm = { text: t('err.mismatch') };
    return er;
  };

  /* ---------- الأفعال ---------- */
  const act = {
    start() { set({ screen: 'setpw', errors: {} }); },
    setPassword({ pw, confirm, remember }) {
      const er = validNew(pw, confirm); if (Object.keys(er).length) return set({ errors: er });
      const go = () => run('setPassword', { t: S.token, pw, remember }, r => {
        keep(r, remember);
        const d = db(); const first = !(d.entered && d.entered[S.token]); d.entered = d.entered || {}; d.entered[S.token] = 1; save(d);
        set({ screen: 'home', errors: {}, offline: false }, first ? 'signature' : 'step');
        S.firstVisit = false; }, () => act.setPassword({ pw, confirm, remember }));
      go();
    },
    login({ pw, remember }) {
      if (!pw) return set({ errors: { pw: { text: t('err.empty') } } });
      run('login', { t: S.token, pw, remember }, r => { keep(r, remember); set({ screen: 'home', errors: {} }); }, () => act.login({ pw, remember }));
    },
    loginGeneric({ email, pw, remember }) {
      if (!email) return set({ errors: { email: { text: t('err.emailEmpty') } } });
      if (!pw) return set({ errors: { pw: { text: t('err.empty') } } });
      run('loginGeneric', { email, pw, remember }, r => {
        if (r.admin) return set({ screen: 'admin', errors: {} });
        S.token = r.t; keep(r, remember); set({ leader: r.leader, screen: 'home', errors: {} });
      }, () => act.loginGeneric({ email, pw, remember }));
    },
    forgot() { run('forgot', { t: S.token }, () => set({ screen: 'resetSent', errors: {} }), () => act.forgot()); },
    sendLink({ email }) {
      if (!email) return set({ errors: { email: { text: t('err.emailEmpty') } } });
      run('sendLink', { email }, () => set({ screen: 'sent', errors: {} }), () => act.sendLink({ email }));
    },
    reset({ pw, confirm, remember }) {
      const er = validNew(pw, confirm, S.resetAdmin); if (Object.keys(er).length) return set({ errors: er });
      remember = remember !== false;
      run('reset', { t: S.token, r: S.reset, pw, remember }, r => {
        /* رابط ضبط كلمة الأدمن: الجلسة حفظها onResponse، فندخل لوحة الأدمن مباشرة */
        if (r.admin) { S.reset = null; S.resetAdmin = false; S.leader = null; S.token = null; cleanUrl(null); return set({ screen: 'admin', errors: {} }); }
        if (r.t) { S.token = r.t; S.leader = r.leader || S.leader; }
        S.reset = null; keep(r, remember); cleanUrl(S.token);
        clearInterval(lockTimer); set({ locked: false, screen: 'home', errors: {} }); }, () => act.reset({ pw, confirm, remember }));
    },
    newResetLink() { run('forgot', S.reset ? { r: S.reset } : { t: S.token }, () => set({ screen: 'resetSent', errors: {} }), () => act.newResetLink()); },
    about() { set({ about: true }); },
    back() { set({ about: false, errors: {} }); },
    goGeneric() { S.leader = null; S.token = null; set({ screen: 'generic', errors: {} }); },
    goLogin() { set({ screen: S.leader ? 'login' : 'generic', errors: {} }); },
    clearError(field) { if (S.errors[field]) { const e = Object.assign({}, S.errors); delete e[field]; set({ errors: e }); } }
  };

  /* ---------- البداية ---------- */
  async function init(opts) {
    render = opts.render; endpoint = (opts.endpoint || '').trim(); S.mode = endpoint ? 'live' : 'demo'; onResponse = opts.onResponse || null;
    const p = new URLSearchParams(location.search);
    if (!endpoint) return set({ screen: 'generic' }, 'none');
    const failInit = e => {
      if (e.code === 'expired') return set({ screen: 'expired', errors: {} }, 'none');
      if (e.code === 'badlink') return set({ screen: 'badlink', errors: { form: { text: t('err.badLink'), contact: true } } }, 'none');
      set({ screen: 'generic', offline: e.code === 'offline' || e.name === 'TypeError', errors: { form: { text: t(e.code === 'offline' || e.name === 'TypeError' ? 'err.offline' : 'err.server') } } }, 'none');
    };
    const rs = p.get('r');
    if (rs) { // رابط التعيين من البريد: ?r=RESET_TOKEN
      S.reset = rs; cleanUrl(null); S.firstVisit = false;
      try { const r = await call('me', { r: rs }); S.leader = r.leader; S.resetAdmin = !!r.admin; set({ screen: 'reset' }, 'none'); }
      catch (e) { failInit(e); }
      return;
    }
    const dv = devGet();
    const tok = p.get('t') || (dv && dv.t);
    if (!tok) return set({ screen: 'generic' }, 'none');
    S.token = tok;
    try { const r = await call('me', { t: tok, d: dv && dv.t === tok ? dv.d : undefined }); S.leader = r.leader; S.firstVisit = !r.hasPassword;
      if (!r.remembered && dv && dv.t === tok) devClear();
      if (!p.get('t') && !r.remembered) { S.leader = null; S.token = null; return set({ screen: 'generic' }, 'none'); }
      set({ screen: r.remembered ? 'home' : r.hasPassword ? 'login' : 'intro' }, 'none'); }
    catch (e) {
      /* الرابط العام مع جهاز متذكَّر لم يعد صالحًا (أُوقف الوصول مثلًا): ننسى الجهاز ونعرض الدخول العام */
      if (!p.get('t') && e.code === 'badlink') { devClear(); S.leader = null; S.token = null; return set({ screen: 'generic' }, 'none'); }
      failInit(e);
    }
  }

  let onResponse = null;
  window.Bosla = { init, t, act, get state() { return S; }, copy: COPY, minutesText, leftText, patch(p) { set(p); } };
})();

</script>

    const card = $('#card'), cardIn = $('#cardIn'), cardBg = $('#cardBg'), stage = $('#stage'), home = $('#home');

    function pwField(id, label, ac, hint, hk, tall) {
      return `<label class="b-lbl b-rise" for="${id}" style="--i:${hk}">${label}</label>
  <div class="b-field b-rise" style="--i:${hk}"><input class="b-inp b-inp--pw" id="${id}" name="${id === 'pw' ? 'password' : id}" data-field="${id}" type="password" dir="ltr" autocomplete="${ac}" autocapitalize="off" spellcheck="false" enterkeyhint="${id === 'pw' && ac === 'new-password' ? 'next' : 'go'}" aria-describedby="${id}-msg">
  <button type="button" class="b-eye" data-eye="${id}" aria-controls="${id}" aria-pressed="false" aria-label="${esc(T('field.show'))}">${ICON.eye}</button></div>

      return `<label class="b-lbl b-rise" for="email" style="--i:${hk}">${T('field.email')}</label>

    function build(key, s) {
      const sc = key === 'about' ? 'intro' : key;
      if (sc === 'intro') {

          } else { stage.hidden = true; home.hidden = false; bz.state(st); if (!initial) (from === 'about' ? home.querySelector('[data-act="about"]') : $('#hh')).focus({ preventScroll: true }); }
          cur = { key: 'home', root: home }; prevErr = {};
        } else {
          const step = !initial && first && from !== 'home' && s.animate;
          const fadeStep = !initial && first && from !== 'home' && !s.animate;
          if (step || fadeStep) { root.classList.add('b-step'); clean('b-step', 340); }
          showCard(key, s, initial ? 'init' : (step || fadeStep) ? 'step' : 'swap');
          bz.state(st);
          if (initial && s.animate && key === 'intro') { root.classList.add('b-enter'); clean('b-enter', 1300); }
          if (!initial) focusFirst();
        }
      } else {
        if (bz.current !== st && !root.classList.contains('b-sig')) bz.state(st);
        /* الرئيسية: تتحدث حين تصل حالة الأسبوع من الخادم (بلا حركة، والتركيز يبقى) */
        if (key === 'home' && sigOf(s) !== homeSig) { const hadFocus = document.activeElement && home.contains(document.activeElement); buildHome(s); if (hadFocus) $('#hh').focus({ preventScroll: true }); }
      }
      patch(s);
      place(); schedulePlace();
    }
    return {
      render,
      destroy() { ac.abort(); timers.forEach(clearTimeout); timers.clear(); if (spinAnim) spinAnim.cancel(); bz.destroy(); hostEl.innerHTML = ''; }
    };
  }

  window.BoslaViews.entry = {
    mount(hostEl) { inst = create(hostEl); },
    unmount() { if (inst) inst.destroy(); inst = null; },
    render(s) { if (inst) inst.render(s); }
  };
})();

      if (t.name === 'q2') { st.q2 = t.value; patch(); }

    const mine = W.week === n;
    const local = rj(LDK), useLocal = !!(local && local.t === tokenNow() && local.w === n && local.d && (!mine || !W.draftAt || local.at > W.draftAt));

    const h0 = $('#h'); if (h0) h0.focus({ preventScroll: true });

    return { destroy() { unBands(); flush(); ac.abort(); timers.forEach(clearTimeout); timers.clear(); delete hostEl.dataset.wk; hostEl.innerHTML = ''; } };
  }

  window.BoslaViews.activity = {
    mount(hostEl, opts) { inst = create(hostEl, opts || {}); },
    unmount() { if (inst) inst.destroy(); inst = null; }
  };
})();

    /* إجابات الأسبوع: الخيار الذي اختاره بنصه، وما رآه بالضبط (النصوص المعتمدة وقت إكماله) */
    function answers(l){
      const N=UI.week,w=cw(l),he=l.gender==='f';
      if(N===4){
        if(!w.replies.length&&!w.dtext)return BUI.empty({quiet:true,title:w.status==='none'?'لم يفتح النشاط بعد':'لم يرسل ردًا بعد',body:w.status==='opened'?(he?'فتحت النشاط، ولم تكتب بعد.':'فتح النشاط، ولم يكتب بعد.'):''});
        return `${w.replies.length?`<div class="a-kv"><span>الردود</span><b>${nRep(w.replies.length)}</b></div>
          <div class="a-blk"><h3>ما كتبه، كل رد بوقته</h3><ol class="a-quotes" data-saw="replies">${w.replies.map(r=>`<li><q style="white-space:pre-wrap">${esc(r.text)}</q> <time>${esc(fmt(r.at))}</time></li>`).join('')}</ol></div>`:''}
          ${w.dtext?`<div class="a-saw a-draft" data-saw="draft"><p class="a-tags"><span class="b-tag is-now">لم يُرسل بعد</span></p><p class="b-body" style="white-space:pre-wrap">${esc(w.dtext)}</p></div>`:''}`}
      const S=w.status==='done'?seenAt(l,N,w.doneAt):App.wk(N,l.gender);
      const opt=(q,k)=>k?`<li>${esc(S[q].options[k])}</li>`:'';
      const qa=(q,k)=>`<div class="a-blk"><h3>${esc(S[q].question)}</h3><ul class="a-rs">${k?opt(q,k):'<li class="a-dim">لم يختر بعد</li>'}</ul></div>`;
      if(w.status==='done'){const r=resultOf(N,S,w.q1,w.q2),L=S.labels;
        return `<div class="a-kv"><span>أكمل</span><b>${esc(fmt(w.doneAt))}</b></div>${qa('q1',w.q1)}${qa('q2',w.q2)}
        <div class="a-blk"><h3>ما رآه بالضبط</h3><div class="a-saw" data-saw="result" data-week="${N}">
          ${L.resultK?`<p class="a-small" data-r="label">${esc(L.resultK)}</p>`:''}
          <p class="b-result-name" data-r="diagnosisTitle">${esc(r.title)}</p><p class="b-body" data-r="diagnosisDescription">${esc(r.description)}</p>
          ${N===1?`<p class="b-body" data-r="sectorLine"><b>${esc(L.sectorK)}</b> ${esc(r.sector)}</p>`:''}
          ${N===2?`<p class="a-small">${esc(L.teamK)}</p><p class="b-body" data-r="teamObservation"><b>${esc(r.obs.title)}</b><br>${esc(r.obs.description)}</p>`:''}
          <p class="a-small">${esc(L.tryK)}</p><p class="b-body q-close" data-r="weeklyExperiment">${esc(r.experiment)}</p></div></div>`}
      if(w.status==='draft')
        return `<div class="a-saw a-draft" data-saw="draft"><p class="a-tags"><span class="b-tag is-now">لم يُرسل بعد</span><span class="a-dim" style="font-size:var(--fs-small)">آخر حفظ تلقائي ${esc(fmt(w.lastAt))}</span></p>
          <div class="a-kv"><span>وصل إلى</span><b>${w.step==='q1'?'السؤال الأول':'السؤال الثاني'}</b></div>${qa('q1',w.dq1)}${qa('q2',w.dq2)}
          <p class="a-note">لا نتيجة بعد، فهي تظهر حين يرسل.</p></div>`;
      return BUI.empty({quiet:true,title:w.status==='none'?'لم يفتح النشاط بعد':'لم يبدأ الأسئلة بعد',body:w.status==='none'?(N===1?'وصله إيميل الدعوة، ولم يفتحه.':''):'فتح النشاط، ولم يختر بعد.'})}

    /* ---------- النصوص ---------- */
    function tTags(k,o){const d=draftOf(k),c=cur(k),out=[];
      if(d)out.push('<span class="b-tag is-now">مسودة</span>');
      if(needsF(k))out.push('<span class="b-tag is-off">تحتاج نسخة للقائدة</span>');
      else if(TXK[k].f!=null)out.push('<span class="b-tag">له وللقائدة</span>');
      else if(TXK[k].one)out.push('<span class="b-tag">صيغة واحدة للجنسين</span>');
      const t=d||c;if(over(k,t.m)||(t.f&&over(k,t.f)))out.push('<span class="b-tag is-off">أطول من مساحته</span>');
      if(c.at>SEED_AT&&!o)out.push('<span class="b-tag is-done">عُدّل</span>');
      return out.join('')}
    function vTexts(){
      const all=TX.filter(t=>t.g===UI.g&&(UI.g!=='dept'||t.dept===UI.dept));
      const drafts=TX.filter(t=>draftOf(t.key)).length,fem=TX.filter(t=>needsF(t.key)).length;
      const secs=[...new Set(all.map(t=>t.sec))];
      return `<div class="a-h"><div><h1 id="h" tabindex="-1">النصوص</h1><p class="b-sub">لا يتغير شيء للقادة إلا بعد «اعتماد».</p></div></div>
      <div class="a-sum">${drafts?`<span class="b-tag is-now">${drafts} ${drafts===1?'مسودة':drafts===2?'مسودتان':'مسودات'} لم تُعتمد</span>`:'<span class="b-tag">لا مسودات</span>'}${fem?`<span class="b-tag is-off">${fem} ${fem===1?'نص يحتاج':'نصوص تحتاج'} نسخة للقائدة</span>`:''}</div>
      ${BUI.chips({name:'g',legend:'',items:GROUPS.map(([v,l])=>({value:v,label:l})),value:UI.g}).replace('class="b-chips"','class="b-chips a-groups" style="margin-top:var(--s12)" aria-label="مجموعات النصوص"')}
      ${UI.g==='dept'?`<div style="margin-top:var(--s12)"><label class="b-lbl" for="dsel">الإدارة</label><select class="a-sel" id="dsel">${CD.depts.map(d=>{const who=leaders().filter(l=>!l.test&&l.dept===d.k).map(l=>l.first).join('، ');return `<option value="${d.k}"${d.k===UI.dept?' selected':''}>${esc(d.ar)}${who?' · '+esc(who):''}</option>`}).join('')}</select>
        <p class="a-note">مساحة مثال الحلقة ${LIM.ring} حرفًا تقريبًا.</p></div>`:''}
      ${secs.map(s=>`<section class="a-sec" aria-label="${esc(s)}"><h2>${esc(s)} <small>${all.filter(t=>t.sec===s).length}</small></h2><ul class="a-tlist">${all.filter(t=>t.sec===s).map(t=>{const d=draftOf(t.key),v=d||cur(t.key);
        return `<li><a href="#text/${encodeURIComponent(t.key)}">${esc(t.label)}</a><p>${esc(v.m)}</p>${tTags(t.key)?`<span class="a-tags">${tTags(t.key)}</span>`:''}</li>`}).join('')}</ul></section>`).join('')}`}
    function vText(k){
      const t=TXK[k];if(!t)return `<a class="a-back" href="#texts">${ICON.back}النصوص</a>`+BUI.empty({title:'لم نجد هذا النص'});
      const c=cur(k),d=draftOf(k),v=d||c,hasF=t.f!=null||t.needF,vs=versions(k);
      const grp=(GROUPS.find(g=>g[0]===t.g)||[])[1],dp=t.dept?' · '+DEPT[t.dept].ar:'';
      const field=(x,lbl)=>`<div class="a-ed"><label class="b-lbl" for="ed-${x}">${lbl}${t.limit?`<small data-cnt="${x}"></small>`:''}</label>
        <textarea class="b-inp b-inp--area${t.limit&&t.limit<20?' is-short':''}" id="ed-${x}" data-ed="${x}" rows="${t.limit&&t.limit<20?1:3}">${esc(v[x]||'')}</textarea>
        <p class="a-warn" data-warn="${x}" hidden>${ICON.alert}<span></span></p></div>`;
      return `<a class="a-back" href="#texts">${ICON.back}النصوص</a>
      <div class="a-h"><div><p class="b-eyebrow">${esc(grp+dp+' · '+t.sec)}</p><h1 id="h" tabindex="-1">${esc(t.label)}</h1><p class="b-sub">يظهر في: ${esc(t.where)}${t.limit?`، ومساحته ${t.limit} حرفًا تقريبًا`:''}</p>${t.one?'<p class="b-sub">صيغة واحدة للجنسين: تُكتب كما هي للقائد والقائدة.</p>':''}</div></div>
      <div class="a-grid is-lead">
      <section class="a-card" aria-labelledby="e1"><h2 id="e1">المعتمد الآن <small>${esc(fmt(c.at,{date:1}))}</small></h2>
        <p class="a-cur">${hasF?'<span class="a-vk">للقائد</span>':''}${esc(c.m)}</p>
        ${hasF?(c.f?`<p class="a-cur"><span class="a-vk">للقائدة</span>${esc(c.f)}</p>`:`<p class="a-cur is-empty"><span class="a-vk">للقائدة</span>لم تُكتب بعد، فترى القائدة نسخة القائد.</p>`):''}
        <h2 style="margin-top:var(--s20)">التاريخ <small>${vs.length===1?'نسخة واحدة':vs.length+' نسخ'}</small></h2>
        <ol class="a-hist" reversed>${vs.slice().reverse().map((x,i)=>`<li><b>${i===0?'المعتمد الحالي':'نسخة سابقة'} · ${esc(x.seed?'المعتمد الأول، '+fmt(x.at,{date:1}):fmt(x.at))}</b><p>${esc(x.m)}</p>${x.f?`<p>للقائدة: ${esc(x.f)}</p>`:''}</li>`).join('')}</ol></section>
      <section class="a-card" aria-labelledby="e2"><h2 id="e2">المسودة ${d?'<span class="b-tag is-now">لم تُعتمد</span>':''}</h2>
        <p class="b-sub">تُحفظ تلقائيًا وأنت تكتب، ولا يراها القادة.</p>
        ${field('m',hasF?'للقائد':'النص')}${hasF?field('f','للقائدة'+(needsF(k)?' (لم تُكتب بعد)':'')):''}
        <p class="a-warn" data-warn="holes" hidden>${ICON.alert}<span></span></p>
        <p class="b-status a-autos" id="autos" aria-live="polite"></p>
        <div class="a-edacts"><button type="button" class="b-btn" data-primary data-act="approve"><span class="t">اعتماد</span></button>
          <button type="button" class="b-btn b-btn--quiet" data-act="discard"><span class="t">تجاهل المسودة</span></button></div></section></div>`}
    function patchEditor(k){
      const t=TXK[k],d=draftOf(k),c=cur(k),v=d||c;
      ['m','f'].forEach(x=>{const cn=$(`[data-cnt="${x}"]`),w=$(`[data-warn="${x}"]`),ta=$(`#ed-${x}`);if(!ta)return;const n=[...ta.value].length;
        if(cn)cn.textContent=`${n} من ${t.limit}`;
        if(w){const o=t.limit&&n>t.limit;w.hidden=!o;if(o)w.querySelector('span').textContent=`أطول من مساحتها بـ${n-t.limit} ${n-t.limit===1?'حرف':n-t.limit===2?'حرفين':n-t.limit<=10?'أحرف':'حرفًا'}، فقد لا يظهر كاملًا.`}});
      const hw=$('[data-warn="holes"]'),gap=(a,b)=>holes(a||'').split(' ').filter(x=>x&&!holes(b||'').split(' ').includes(x));
      const miss=[...new Set([...gap(t.m,v.m),...(t.f&&v.f?gap(t.f,v.f):[])])];
      hw.hidden=!miss.length;if(miss.length)hw.querySelector('span').textContent=`المسودة بلا ${miss.join(' و')}، وهو مكان يملؤه النظام. أعده قبل الاعتماد.`;
      $('[data-act=approve]').disabled=!d||!!miss.length;$('[data-act=discard]').disabled=!d}

    /* ---------- السجل ---------- */
    function vLog(){return `<div class="a-h"><div><h1 id="h" tabindex="-1">سجل التغييرات</h1><p class="b-sub">كل اعتماد وكل إجراء على القادة، الأحدث أولًا.</p></div></div>
      <div class="a-card">${D.log.length?`<ol class="a-log">${D.log.map(e=>`<li><span>${esc(e.msg)}</span><time>${esc(fmt(e.at))}</time></li>`).join('')}</ol>`:BUI.empty({quiet:true,icon:IC.log,title:'لا تغييرات بعد',body:'تظهر هنا الاعتمادات والإجراءات حين تحدث.'})}</div>`}

    /* ================= التوجيه بين الأقسام ================= */
    function route(){const h=decodeURIComponent(location.hash.slice(1)||'overview'),[a,b]=[h.split('/')[0],h.split('/').slice(1).join('/')];return {a,b}}
    let lastRoute='';
    function render(focus){
      const {a,b}=route(),sec=a==='leader'?'leaders':a==='text'?'texts':(NAV.some(n=>n[0]===a)?a:'overview');
      $('#nav').innerHTML=navHTML(sec);
      $('#view').innerHTML=!D?(loadErr?BUI.empty({icon:ICON.off,title:'لم نستطع تحميل البيانات',body:'تحقق من الاتصال، ثم حدّث الصفحة.'}):BUI.empty({quiet:true,icon:ICON.users,title:'نحمّل البيانات…'})):a==='leaders'?vLeaders():a==='leader'?vLeader(b):a==='texts'?vTexts():a==='text'?vText(b):a==='log'?vLog():vOverview();
      if(D&&a==='text'&&TXK[b])patchEditor(b);
      document.title=(NAV.find(n=>n[0]===sec)||NAV[0])[1]+' · بوصلة القائد · الأدمن';
      if(focus){scrollTo(0,0);const hh=$('#h');if(hh)hh.focus({preventScroll:true})}}
    on(window,'hashchange',()=>{Object.keys(EDIT).forEach(k=>saveNow(k).catch(()=>{}));const r=location.hash;render(r!==lastRoute);lastRoute=r});

    /* ================= نافذة التأكيد ================= */
    const dlg=$('#dlg');let dlgOk=null,opener=null;
    function ask(o){opener=document.activeElement;dlgOk=o.onOk;
      dlg.innerHTML=`<form method="dialog" novalidate><h2 class="b-title" id="dlgH">${esc(o.title)}</h2>${o.body?`<p class="b-body">${esc(o.body)}</p>`:''}${o.form||''}
        <div class="a-dacts"><button class="b-btn" type="submit" value="ok" data-dlg="ok"><span class="t">${esc(o.ok)}</span></button><button class="b-btn b-btn--quiet" type="button" data-dlg="cancel"><span class="t">${esc(o.cancel||'إلغاء')}</span></button></div></form>`;
      document.body.classList.add('is-modal');
      try{dlg.showModal()}catch(e){dlg.setAttribute('open','')}
      const f=dlg.querySelector('input,select,textarea');(f||dlg.querySelector('[data-dlg=cancel]')).focus()}
    function closeDlg(){try{dlg.close()}catch(e){dlg.removeAttribute('open')}}
    dlg.addEventListener('close',()=>{document.body.classList.remove('is-modal');dlgOk=null;if(opener&&opener.isConnected)opener.focus()});
    dlg.addEventListener('submit',e=>{e.preventDefault();const b=dlg.querySelector('[data-dlg=ok]');if(b)b.click()});
    dlg.addEventListener('click',e=>{const b=e.target.closest('[data-dlg]');if(!b)return;e.preventDefault();
      if(b.dataset.dlg==='cancel'){closeDlg();return}
      if(dlgOk&&dlgOk(dlg)===false)return;closeDlg()});

    const deptOpts=sel=>CD.depts.map(d=>`<option value="${d.k}"${d.k===sel?' selected':''}>${esc(d.ar)}</option>`).join('');
    const fld=(id,lbl,inp)=>`<div><label class="b-lbl" for="${id}">${lbl}</label>${inp}<p class="b-msg" data-msg="${id}" aria-live="polite"></p></div>`;
    const genderSeg=v=>BUI.seg({name:'gd',legend:'الجنس',items:[{value:'m',label:'قائد'},{value:'f',label:'قائدة'}],value:v});
    function setMsg(id,t){const m=dlg.querySelector(`[data-msg="${id}"]`);if(m)m.textContent=t||'';const i=dlg.querySelector('#'+id);if(i)i.setAttribute('aria-invalid',t?'true':'false');if(t&&i)i.focus()}

    /* ================= الأحداث ================= */
    on(document,'click',e=>{
      if(!hostEl.contains(e.target))return;
      if(e.target.closest('[data-act=logout]')){e.preventDefault();App.adminOut(false);return}
      const wk=e.target.closest('[data-week]');if(wk){picked=true;UI.week=+wk.dataset.week;render(false);const n=$(`[data-week="${UI.week}"]`);if(n)n.focus();return}
      const a=e.target.closest('[data-act]');if(!a||a.disabled)return;const what=a.dataset.act,{b}=route();
      if(what==='addLeader')return ask({title:'إضافة قائد جديد',body:'بعد الإضافة انسخ رابطه الشخصي من صفحته، وأرسله له من بريدك.',ok:'أضف القائد',
        form:`<div class="b-fields">${fld('nf','الاسم الأول','<input class="b-inp" id="nf" type="text" autocomplete="off" style="direction:rtl;text-align:right">')}
          ${fld('nfull','الاسم الكامل','<input class="b-inp" id="nfull" type="text" autocomplete="off" style="direction:rtl;text-align:right">')}
          ${fld('nem','الإيميل','<input class="b-inp" id="nem" type="email" inputmode="email" autocomplete="off" dir="ltr">')}
          ${fld('nd','الإدارة',`<select class="a-sel" id="nd">${deptOpts(CD.depts[0].k)}</select>`)}${genderSeg('m')}</div>`,
        onOk(d){const first=d.querySelector('#nf').value.trim(),em=d.querySelector('#nem').value.trim().toLowerCase();
          setMsg('nf','');setMsg('nem','');
          if(!first){setMsg('nf','اكتب الاسم الأول.');return false}
          if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){setMsg('nem','اكتب إيميلًا صحيحًا، مثل name@elm.sa');return false}
          if(leaders().some(l=>l.email.toLowerCase()===em)){setMsg('nem','هذا الإيميل لقائد موجود.');return false}
          const dk=d.querySelector('#nd').value,gd=BUI.val(d,'gd')||'m';
          act('leaderAdd',{first,fullAr:d.querySelector('#nfull').value.trim()||first,email:em,dept:dk,gender:gd,note:`أضفت قائدًا جديدًا: ${first}، ${DEPT[dk].ar}`},'أضفنا القائد')}});
      const l=a.dataset.token?byId(a.dataset.token):route().a==='leader'?byId(b):null;
      if(what==='fix'&&l)return ask({title:`تصحيح بيانات ${l.first}`,body:'يظهر التصحيح للقائد في الرسائل والصفحات القادمة.',ok:'احفظ التصحيح',
        form:`<div class="b-fields">${fld('ff','الاسم الأول',`<input class="b-inp" id="ff" type="text" autocomplete="off" value="${esc(l.first)}" style="direction:rtl;text-align:right">`)}
          ${fld('fd','الإدارة',`<select class="a-sel" id="fd">${deptOpts(l.dept)}</select>`)}${genderSeg(l.gender)}</div>`,
        onOk(d){const first=d.querySelector('#ff').value.trim(),dk=d.querySelector('#fd').value,gd=BUI.val(d,'gd');
          if(!first){setMsg('ff','اكتب الاسم الأول.');return false}
          const ch=[];if(first!==l.first)ch.push(`الاسم من ${l.first} إلى ${first}`);if(dk!==l.dept)ch.push(`الإدارة إلى ${DEPT[dk].ar}`);if(gd!==l.gender)ch.push(`الجنس إلى ${gd==='f'?'أنثى':'ذكر'}`);
          if(!ch.length){BUI.toast('لم يتغير شيء');return}
          act('leaderUpdate',{token:l.id,first,dept:dk,gender:gd,note:`صحّحت بيانات ${l.first}: ${ch.join('، ')}`},'حفظنا التصحيح')}});
      if(what==='access'&&l){const off=l.access!=='off';return ask({title:off?`إيقاف وصول ${l.first}؟`:`إعادة وصول ${l.first}؟`,
        body:off?'لن يستطيع الدخول إلى البوصلة حتى تعيد وصوله. إجاباته تبقى محفوظة.':'يعود الرابط وكلمة المرور للعمل كما كانا.',ok:off?'أوقف الوصول':'أعد الوصول',
        onOk(){act('leaderAccess',{token:l.id,on:!off,note:off?`أوقفت وصول ${l.first}`:`أعدت وصول ${l.first}`},off?'أوقفنا الوصول':'أعدنا الوصول')}})}
      if(what==='unlock'&&l)return ask({title:`فك القفل عن ${l.first}؟`,body:'أُقفل الدخول بعد محاولات خاطئة. بعد الفك يستطيع المحاولة الآن.',ok:'فك القفل',
        onOk(){act('leaderUnlock',{token:l.id,note:`فككت القفل عن ${l.first}`},'فككنا القفل')}});
      if(what==='copyLink'&&l){const u=linkOf(l);const done=()=>BUI.toast('نسخنا الرابط الشخصي');
        const fall=()=>ask({title:`الرابط الشخصي لـ${l.first}`,body:'انسخه من الحقل. هذا الرابط له وحده.',ok:'تم',cancel:'إغلاق',form:`<div class="b-fields"><label class="b-vh" for="lk">الرابط</label><input class="b-inp a-ro" id="lk" readonly value="${esc(u)}"></div>`,onOk(){}});
        try{navigator.clipboard.writeText(u).then(done,fall)}catch(err){fall()}return}
      if(what==='resetLink'&&l)return ask({title:`رابط كلمة مرور جديدة لـ${l.first}`,body:`ننشئ رابطًا يعمل ساعة واحدة ومرة واحدة، ويُبطل أي رابط قبله. تنسخه وترسله ${l.gender==='f'?'لها':'له'} من بريدك.`,ok:'أنشئ الرابط',
        onOk(){App.adminApi('resetLink',{token:l.id,note:`أنشأت رابط تعيين كلمة مرور لـ${l.first}`}).then(res=>{showLink(l,res.link);reload().then(()=>render(false))},e=>{
          if(e.code==='auth')return;BUI.toast(e.code==='off'?'وصول هذا القائد موقوف. أعد وصوله أولًا.':e.code==='offline'?'الاتصال منقطع، فلم يتغير شيء.':'لم يصل الطلب، فلم يتغير شيء. جرّب مرة أخرى.',{icon:ICON.alert})})}});
      if(what==='reqDone'&&a.dataset.rid)return act('requestDone',{rid:a.dataset.rid},'أغلقنا الطلب');
      if(what==='approve'&&b&&TXK[b]){const t=TXK[b];return ask({title:'اعتماد هذا النص؟',body:'يظهر للقادة فورًا، ويُحفظ المعتمد السابق في التاريخ.',ok:'اعتمد',
        onOk(){if(!draftOf(b))return;saveNow(b).then(()=>act('textApprove',{key:b,note:`اعتمدت نصًا جديدًا: ${t.label} (${t.sec})`},'اعتمدنا النص'),()=>{})}})}
      if(what==='discard'&&b&&TXK[b])return ask({title:'تجاهل المسودة؟',body:'تُحذف المسودة، ويبقى المعتمد كما هو.',ok:'تجاهل المسودة',
        onOk(){clearTimeout(saveT);delete EDIT[b];act('textDiscard',{key:b,note:`تجاهلت مسودة: ${TXK[b].label} (${TXK[b].sec})`},'تجاهلنا المسودة')}});
    });
    /* الرابط الجديد في نافذة: يُنسخ بالزر، ويبقى ظاهرًا حتى «إغلاق» */
    function showLink(l,u){setTimeout(()=>ask({title:`رابط كلمة المرور لـ${l.first}`,body:`يعمل ساعة واحدة ومرة واحدة. انسخه وأرسله ${l.gender==='f'?'لها':'له'} من بريدك.`,ok:'انسخ الرابط',cancel:'إغلاق',
      form:`<div class="b-fields"><label class="b-vh" for="lk">الرابط</label><input class="b-inp a-ro" id="lk" readonly dir="ltr" value="${esc(u)}"></div>`,
      onOk(d){const i=d.querySelector('#lk');try{i.select()}catch(e){}
        const okT=()=>BUI.toast('نسخنا الرابط'),no=()=>BUI.toast('انسخه من الحقل.');
        try{navigator.clipboard.writeText(u).then(okT,()=>{try{document.execCommand('copy')?okT():no()}catch(e){no()}})}catch(e){no()}
        return false}}),30)}
    let saveT=0;
    /* كل إجراء: الخادم أولًا، ثم نحدّث البيانات والشاشة. الخطأ يظهر في تنبيه، ولا يتغير شيء */
    function act(action,body,ok){return App.adminApi(action,body).then(()=>reload()).then(()=>{BUI.toast(ok);render(false)},e=>{
      if(e.code==='auth')return;BUI.toast(e.code==='offline'?'الاتصال منقطع، فلم يتغير شيء.':e.code==='exists'?'هذا الإيميل لقائد موجود.':'لم يصل الطلب، فلم يتغير شيء. جرّب مرة أخرى.',{icon:ICON.alert})})}
    /* حفظ المسودة في الخادم (بعد توقف قصير أثناء الكتابة) */
    function saveNow(k){clearTimeout(saveT);if(!(k in EDIT))return Promise.resolve();const d=EDIT[k];
      const req=d?App.adminApi('textSaveDraft',{key:k,m:d.m,f:d.f||''}):App.adminApi('textSaveDraft',{key:k,clear:true});
      return req.then(()=>{if(EDIT[k]===d){delete EDIT[k];const T0=D.texts[k]||(D.texts[k]={vers:[],draft:null});T0.draft=d}
        BUI.status($('#autos'),d?{kind:'ok',text:'حُفظت المسودة'}:{kind:'ok',text:'المسودة مطابقة للمعتمد'})},
        e=>{BUI.status($('#autos'),{kind:'err',icon:e.code==='offline'?ICON.off:ICON.alert,text:e.code==='offline'?'الاتصال منقطع. المسودة هنا فقط حتى يعود الاتصال.':'لم نحفظ المسودة. جرّب مرة أخرى.'});throw e})}
    on(document,'input',e=>{const t=e.target;if(!hostEl.contains(t))return;
      if(t.id==='q'){UI.q=t.value;$('#rows').innerHTML=rowsHTML();return}
      if(t.dataset&&t.dataset.ed){const k=route().b,c=cur(k),m=($('#ed-m')||{}).value||'',f=($('#ed-f')||{}).value||'';
        EDIT[k]=(m===c.m&&f===(c.f||''))?null:{m,f};patchEditor(k);
        BUI.status($('#autos'),{kind:'busy',text:'يحفظ…'});clearTimeout(saveT);
        saveT=setTimeout(()=>{saveNow(k).catch(()=>{})},600)}});
    on(document,'change',e=>{const t=e.target;if(!hostEl.contains(t))return;
      if(t.name==='f'){UI.f=t.value;$('#rows').innerHTML=rowsHTML()}
      if(t.name==='g'){UI.g=t.value;render(false);const n=$(`input[name=g][value="${UI.g}"]`);if(n)n.focus()}
      if(t.id==='dsel'){UI.dept=t.value;render(false);$('#dsel').focus()}});

    /* لاختبارات القبول */
    window.__admin={leaders,TX,seenAt,resultOf,state:()=>D,reload:()=>reload().then(()=>render(false))};
    lastRoute=location.hash;render(false);
    reload().then(()=>render(false),()=>{});
    return { destroy() { ac.abort(); clearTimeout(saveT); try { if (dlg.open) dlg.close(); } catch (e) {} hostEl.innerHTML = ''; } };
  }
  window.BoslaViews.admin = {
    mount(hostEl) { inst = create(hostEl); },
    unmount() { if (inst) inst.destroy(); inst = null; }
  };
})();

</script>
<script>
/* بوصلة القائد · الموقع الحي: الموجّه والاتصال بالخادم والنصوص المعتمدة.
 * الشاشات أربع، ولا يكون في الصفحة إلا واحدة منها (تُركَّب وتُفك، ولكل واحدة CSS يُفعَّل معها فقط):
 *   entry    = designs/A2 (الدخول والرئيسية) فوق base.live.js
 *   intro    = designs/W1-intro2/ring0 (تعريف الأسبوع الأول: البطاقة ثم الحلقة)
 *   activity = نشاط الأسبوع n: W1-qa، W2-shelf، W3-eyes، W4-fail
 *   admin    = designs/ADMIN
 * الأسابيع الأربعة: كل أسبوع يفتح الأحد 00:00 بتوقيت الرياض ويُقفل الأحد التالي (بساعة الخادم، والنسخة هنا احتياط للعرض فقط).
 * الإعداد من البناء: window.BOSLA_CONFIG = { endpoint, mode:'live'|'mock', demo }
 */
(function () {
  'use strict';
  const CFG = window.BOSLA_CONFIG || { endpoint: '', mode: 'mock' };
  const DATA = window.BOSLA_DATA;
  const COPY = window.BOSLA_COPY;
  const DEFAULTS = JSON.parse(JSON.stringify(COPY));
  const root = document.documentElement;
  const SK = 'bosla.session.v1', AK = 'bosla.admin.v1', DEV = 'bosla.device.v1', OVK = 'bosla.copy.v1';
  const rj = (st, k) => { try { return JSON.parse(st.getItem(k)) || null; } catch (e) { return null; } };
  const wj = (st, k, v) => { try { if (v == null) st.removeItem(k); else st.setItem(k, JSON.stringify(v)); } catch (e) {} };
  const clone = o => JSON.parse(JSON.stringify(o));

  /* ---------- الأسابيع الأربعة (نفس جدول الخادم) ---------- */
  const SCHEDULE = [['2026-11-04', '2026-11-15'], ['2026-11-15', '2026-11-22'], ['2026-11-22', '2026-11-29'], ['2026-11-29', '2026-12-06']]
    .map(([o, c], i) => ({ week: i + 1, opensAt: Date.parse(o + 'T00:00:00+03:00'), closesAt: Date.parse(c + 'T00:00:00+03:00') }));
  const WEEK_LABEL = ['الأسبوع الأول', 'الأسبوع الثاني', 'الأسبوع الثالث', 'الأسبوع الأخير'];
  const MONTHS = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];
  /* الساعة: في الوضع المحلي ساعة الخادم المحلي (?now=، يضبطها mock.js في window.BoslaNow)، وفي الحي ساعة الجهاز مصحّحة بساعة الخادم بعد أول رد */
  let skew = 0;
  const now = () => (window.BoslaNow ? window.BoslaNow() : Date.now() + skew);
  const stateOf = (n, t) => { const w = SCHEDULE[n - 1], x = t == null ? now() : t; return x < w.opensAt ? 'soon' : x < w.closesAt ? 'open' : 'closed'; };
  const currentWeek = t => { const x = t == null ? now() : t; for (let i = SCHEDULE.length - 1; i >= 0; i--) if (x >= SCHEDULE[i].opensAt) return i + 1; return 1; };
  /* آخر يوم في الأسبوع n (السبت قبل القفل): «14 نوفمبر» */
  const endDay = n => { const d = new Date(SCHEDULE[n - 1].closesAt - 1 + 3 * 3600e3); return `${d.getUTCDate()} ${MONTHS[d.getUTCMonth()]}`; };

  /* ---------- النصوص المعتمدة من الأدمن: تُطبَّق فوق النصوص المدمجة، والمدمجة احتياط ---------- */
  let OV = {};
  function applyOv(ov, persist) {
    OV = ov && typeof ov === 'object' ? ov : {};
    Object.keys(DEFAULTS).forEach(k => { COPY[k] = DEFAULTS[k]; });
    Object.keys(OV).forEach(k => {
      if (k.slice(0, 5) !== 'copy.') return;
      const ck = k.slice(5), d = DEFAULTS[ck], v = OV[k];
      if (d == null || !v || typeof v.m !== 'string' || !v.m) return;
      COPY[ck] = typeof d === 'object' ? { m: v.m, f: v.f || v.m } : v.m;
    });
    if (persist) wj(localStorage, OVK, OV);
  }
  /* نص واحد: المعتمد إن وُجد (والمؤنث إن كُتب، وإلا نسخة القائد)، وإلا النص المدمج */
  function tx(key, g, m, f) {
    const o = OV[key];
    if (o && o.m) return g === 'f' && o.f ? o.f : o.m;
    return g === 'f' && f != null ? f : m;
  }
  /* أمثلة الحلقة لكل إدارة بعد التعديلات المعتمدة (dept.<k>.ring.<i>) */
  function cal() {
    const C = clone(DATA.CALENDAR);
    C.depts.forEach(d => { d.ring = d.ring.map((t, i) => { const o = OV['dept.' + d.k + '.ring.' + i]; return o && o.m ? o.m : t; }); });
    return C;
  }

  /* ---------- نصوص الأسابيع: planning/W1-QA.json (+ W1-INTRO-DRAFT.json) و W2-SHELF و W3-EYES و W4-FAIL ----------
   * المؤنث: f فيه ما يختلف فقط، ويُدمج فوق المذكر. لكل نص مفتاح للأدمن: w<n>.<المسار>، والحروف أ ب ج د تصير a b c d */
  const merge = (a, b) => { if (b == null) return a; if (a == null || typeof a !== 'object' || typeof b !== 'object') return b; const o = Object.assign({}, a); for (const k in b) o[k] = merge(a[k], b[k]); return o; };
  const strip = d => { const o = Object.assign({}, d); delete o.f; delete o._note; return o; };
  const AKEY = { 'أ': 'a', 'ب': 'b', 'ج': 'c', 'د': 'd' };
  const WK0 = {};
  function wkDefaults(n) {
    if (WK0[n]) return WK0[n];
    let m, f;
    if (n === 1) {
      const Q = DATA.W1, I = DATA.W1I;
      m = Object.assign(strip(Q), { title: I.title, intro: clone(I.intro) });
      f = merge(merge(m, Q.f || {}), I.f || {});
    } else { const D = DATA['W' + n]; m = strip(D); f = merge(m, D.f || {}); }
    return (WK0[n] = { m: clone(m), f: clone(f) });
  }
  function leaves(o, path, out) {
    Object.keys(o).forEach(k => { const v = o[k], p = path.concat(k); if (typeof v === 'string') { if (v) out.push(p); } else if (v && typeof v === 'object') leaves(v, p, out); });
    return out;
  }
  const keyOf = (n, p) => 'w' + n + '.' + p.map(s => AKEY[s] || s).join('.');
  const getP = (o, p) => p.reduce((x, k) => (x == null ? x : x[k]), o);
  const setP = (o, p, v) => { const last = p[p.length - 1]; p.slice(0, -1).reduce((x, k) => x[k], o)[last] = v; };
  /* كل نصوص الأسبوع n للأدمن: [{key, path, m, f}] و f فقط حيث تختلف كتابةً */
  function wkTexts(n) {
    const D = wkDefaults(n);
    return leaves(D.m, [], []).map(p => { const m = getP(D.m, p), f = getP(D.f, p); return { key: keyOf(n, p), path: p, m, f: f !== m ? f : undefined }; });
  }
  /* نصوص الأسبوع n كما يراها القائد/القائدة الآن. pick(key, g, def) اختياري: للأدمن (النص المعتمد وقت الإكمال) */
  function wk(n, g, pick) {
    const D = wkDefaults(n), out = clone(g === 'f' ? D.f : D.m);
    leaves(D.m, [], []).forEach(p => {
      const k = keyOf(n, p), def = getP(out, p);
      if (pick) { setP(out, p, pick(k, g, def)); return; }
      const o = OV[k];
      if (o && o.m) setP(out, p, g === 'f' && o.f ? o.f : o.m);
    });
    return out;
  }

  /* ---------- الخادم: نفس عقد base.js (POST نص JSON بلا رؤوس، فلا preflight) ---------- */
  const err = (code, extra) => Object.assign(new Error(code), { code }, extra || {});
  async function api(action, body) {
    if (!navigator.onLine) throw err('offline');
    let r;
    try { r = await fetch(CFG.endpoint, { method: 'POST', body: JSON.stringify(Object.assign({ action }, body || {})) }); }
    catch (e) { throw err('offline'); }
    let j;
    try { j = await r.json(); } catch (e) { throw err('server'); }
    if (!j || !j.ok) throw err((j && j.error) || 'server', j);
    if (j.copy) applyOv(j.copy, true);
    if (typeof j.now === 'number' && !window.BoslaNow) skew = j.now - Date.now();
    return j;
  }
  /* كل رد ناجح من base.js يمر هنا: النصوص، وجلسة القائد أو الأدمن */
  function onResponse(action, j, body) {
    if (j.copy) applyOv(j.copy, true);
    if (j.session && j.admin) wj(sessionStorage, AK, { s: j.session, at: Date.now() });
    else if (j.session) wj(sessionStorage, SK, { t: j.t || (body && body.t) || Bosla.state.token, s: j.session });
  }
  function auth() {
    const t = Bosla.state.token, ss = rj(sessionStorage, SK), dv = rj(localStorage, DEV);
    return { t, s: ss && ss.t === t ? ss.s : undefined, d: dv && dv.t === t ? dv.d : undefined };
  }

  /* ---------- الأسبوع الحالي للقائد ---------- */
  let week = null, weekFor = null, weekBusy = null;
  const summary = w => ({ week: w.week, state: w.state, done: !!w.done, draft: !!(w.draft || w.started), weeks: w.weeks || [], test: !!w.test });
  function leader() {
    const L = Bosla.state.leader || {};
    return { first: L.first || '', gender: L.gender === 'f' ? 'f' : 'm', email: L.email || '', dept: (week && week.dept) || DATA.CALENDAR.def };
  }
  /* open: يفتح نشاط الأسبوع الحالي (يسجّل «فتح» في الخادم مرة واحدة) */
  function loadWeek(open) {
    const t = Bosla.state.token;
    if (!t) return Promise.reject(err('auth'));
    if (weekBusy && !open) return weekBusy;
    weekFor = t;
    const p = api('week', Object.assign(auth(), open ? { open: true, week: week && week.week } : {})).then(w => {
      if (Bosla.state.token !== t) return w;
      week = w; weekBusy = null;
      Bosla.patch({ week: summary(w), weekOpen: w.state === 'open' });
      return w;
    }, e => {
      weekBusy = null;
      if (e.code === 'auth' || e.code === 'badlink') reauth();
      throw e;
    });
    if (!open) weekBusy = p;
    return p;
  }
  /* الجلسة انتهت (أو الجهاز لم يعد متذكَّرًا): نرجعه لكلمة المرور */
  function reauth() {
    wj(sessionStorage, SK, null); week = null; weekFor = null;
    if (viewName !== 'entry') show('entry', {}, 'replace');
    if (Bosla.state.leader) { Bosla.act.goLogin(); Bosla.patch({ errors: { form: { text: Bosla.t('err.auth') } } }); }
    else Bosla.act.goGeneric();
  }
  /* زر الأسبوع في الرئيسية: الأسبوع الأول يبدأ بالتعريف والحلقة، والبقية تعريفها داخل النشاط.
     الأسبوع المقفل لا يُفتح (والخادم يرفض أي حفظ فيه) */
  /* يفتح شاشة الأسبوع w (intro للأول قبل بدئه، وإلا النشاط). يعيد true إن لم يبدأ بعد (فيُسجَّل «فتح») */
  function enter(w, how) {
    const n = w.week;
    if (n === 1 && !w.done && !(w.draft || w.started)) { show('intro', { week: 1 }, how || 'push'); return true; }
    show('activity', { week: n }, how || 'push');
    return !w.done && !w.started;
  }
  function openWeek(again) {
    const w = week;
    if (!w && !again) { loadWeek(false).then(() => openWeek(true), () => {}); return; }   /* ضغط قبل وصول حالة الأسبوع من الخادم */
    if (!w || w.state !== 'open') return;
    if (enter(w)) loadWeek(true).catch(() => {});
  }
  /* حساب التجربة: يفتح أي أسبوع (1..4) في أي وقت. how='replace' بعد «إعادة التجربة» */
  function openWeekN(n, how) {
    return api('week', Object.assign(auth(), { week: n, open: true })).then(w => {
      if (w.state !== 'open') return;
      week = w; enter(w, how);
    }, e => { if (e.code === 'auth' || e.code === 'badlink') reauth(); });
  }
  /* «إعادة التجربة»: يمسح الأسبوع في الخادم (حساب التجربة فقط) ويبدأه من جديد */
  function restartWeek(n) {
    try { localStorage.removeItem('bosla.draft.v1'); localStorage.removeItem('bosla.submit.v1'); } catch (e) {}
    return api('restart', Object.assign(auth(), { week: n })).then(() => openWeekN(n, 'replace'));
  }
  function home() {
    show('entry', {}, 'push');
    loadWeek(false).catch(() => {});
  }

  /* ---------- الأدمن ---------- */
  const adminS = () => { const a = rj(sessionStorage, AK); return a && a.s; };
  function adminApi(action, body) {
    return api(action, Object.assign({ s: adminS() }, body || {})).catch(e => { if (e.code === 'auth') adminOut(true); throw e; });
  }
  function adminOut(expired) {
    const s = adminS();
    wj(sessionStorage, AK, null);
    if (!expired && s) api('adminLogout', { s }).catch(() => {});
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
    show('entry', {}, 'replace');
    Bosla.act.goGeneric();
    if (expired) Bosla.patch({ errors: { form: { text: Bosla.t('err.adminAuth') } } });
  }

  /* ---------- الشاشات ---------- */
  const host = document.getElementById('v');
  let view = null, viewName = null;
  function show(name, opts, how) {
    if (view) { try { view.unmount(); } catch (e) { console.error(e); } }
    document.querySelectorAll('style[data-view]').forEach(st => { st.media = st.dataset.view === name ? 'all' : 'not all'; });
    root.dataset.view = name;
    ['b-enter', 'b-step', 'b-sig', 'b-sigrm', 'x-still', 'q-still', 'is-intro'].forEach(c => root.classList.remove(c));
    document.body.classList.remove('is-modal');
    host.innerHTML = ''; delete host.dataset.wk;
    viewName = name; view = window.BoslaViews[name];
    const st = { v: name, o: opts || {} };
    if (how === 'push') history.pushState(st, ''); else if (how === 'replace') history.replaceState(st, '');
    window.scrollTo(0, 0);
    view.mount(host, opts || {});
    if (name === 'entry' && booted) view.render(Bosla.state);
  }
  addEventListener('popstate', e => {
    /* تنقّل الأدمن بين أقسامه بالـ hash يطلق popstate بلا حالة: يتولاه الأدمن نفسه */
    if (!e.state && viewName === 'admin' && adminS()) return;
    const st = e.state || { v: 'entry' };
    const inLeader = Bosla.state.screen === 'home' && Bosla.state.leader;
    if (st.v === 'admin' && adminS()) return show('admin', st.o);
    if ((st.v === 'intro' || st.v === 'activity') && inLeader && week && week.state === 'open' && (st.o || {}).week === week.week) return show(st.v, st.o);
    show('entry', {});
    if (inLeader) loadWeek(false).catch(() => {});
  });

  let booted = false;
  function onRender(s) {
    booted = true;
    if (s.screen === 'admin') { if (viewName !== 'admin') show('admin', {}, 'replace'); return; }
    if (viewName === 'entry') window.BoslaViews.entry.render(s);
    if (s.screen === 'home' && s.leader && s.token && weekFor !== s.token) loadWeek(false).catch(() => {});
  }

  /* خريطة رحلة الأسبوع الأول (اعتمدها نادر 4 نوفمبر): أعلى الشاشة، أربع محطات. stage = المحطة الحالية،
     hint = true في آخر خطوة من المحطة فتتلوّن المحطة التالية (الانتقال إلى إجراء جديد) */
  const JOURNEY = ['التعريف', 'المسارات الثلاثة', 'سؤالان', 'نتيجتك'];
  function journey(stage, hint) {
    const ck = '<svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    return `<ol class="b-journey" aria-label="مراحل النشاط">${JOURNEY.map((t, i) => {
      const c = i < stage ? 'done' : i === stage ? 'now' : (hint && i === stage + 1) ? 'next' : '';
      return `<li class="${c}"${i === stage ? ' aria-current="step"' : ''}><b>${i < stage ? ck : i + 1}</b><span>${t}</span></li>`; }).join('')}</ol>`;
  }

  /* المناطق الثلاث (معاينة 4 نوفمبر): الرأس والخريطة ثابتان فوق، والأزرار ثابتة تحت، والمحتوى بينهما في منطقة
     تتمرر وحدها. نقيس حدود المنطقتين فعليًا (تختلف بالجهاز وطول النص) ونضعها في --band-t و--band-b */
  function bands(hostEl) {
    hostEl.classList.add('b-bands');
    const root = document.documentElement;
    const measure = () => {
      const vh = window.innerHeight;
      let t = 0;
      hostEl.querySelectorAll('.b-top, .b-journey').forEach(e => { const r = e.getBoundingClientRect(); if (r.height) t = Math.max(t, r.bottom); });
      const f = hostEl.querySelector('.x-foot .x-row');
      const b = f ? vh - f.getBoundingClientRect().top : 0;
      root.style.setProperty('--band-t', Math.round(t) + 'px');
      root.style.setProperty('--band-b', Math.round(b) + 'px');
      more();
    };
    /* سهم «المزيد»: يظهر فقط إن بقي نص مخفي أسفل المنطقة، ويختفي عند الوصول للنهاية */
    const stage = () => hostEl.querySelector('#ringUI') || hostEl.querySelector('#app');
    const arrow = document.createElement('button');
    arrow.type = 'button'; arrow.className = 'b-more'; arrow.tabIndex = -1; arrow.setAttribute('aria-label', 'المزيد في الأسفل');
    arrow.innerHTML = '<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    hostEl.appendChild(arrow);
    function more() { const st = stage(); hostEl.classList.toggle('has-more', !!st && st.scrollHeight - st.scrollTop - st.clientHeight > 6); }
    arrow.addEventListener('click', () => { const st = stage(); if (st) st.scrollBy({ top: Math.round(st.clientHeight * .7), behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); });
    hostEl.addEventListener('scroll', more, { capture: true, passive: true });
    const ro = new ResizeObserver(measure), mo = new MutationObserver(() => { measure(); hostEl.querySelectorAll('.b-journey, .x-foot').forEach(e => ro.observe(e)); });
    mo.observe(hostEl, { childList: true, subtree: true });
    window.addEventListener('resize', measure);
    measure(); hostEl.querySelectorAll('.b-top, .b-journey, .x-foot').forEach(e => ro.observe(e));
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(measure);
    return () => { ro.disconnect(); mo.disconnect(); window.removeEventListener('resize', measure); hostEl.removeEventListener('scroll', more, { capture: true }); arrow.remove(); hostEl.classList.remove('b-bands', 'has-more'); };
  }

  window.App = { journey, bands, cfg: CFG, defaults: DEFAULTS, api, auth, tx, cal, wk, wkTexts, wkDefaults, leader, loadWeek, openWeek, openWeekN, restartWeek, home, show, adminApi, adminOut,
    now, stateOf, currentWeek, endDay, schedule: SCHEDULE, weekLabel: n => WEEK_LABEL[n - 1],
    get week() { return week; }, set week(w) { week = w; }, get view() { return viewName; }, data: DATA };

  /* ---------- البداية ---------- */
  applyOv(rj(localStorage, OVK), false);
  { const c = currentWeek(); Bosla.state.week = { week: c, state: stateOf(c), done: false, draft: false, weeks: [] }; Bosla.state.weekOpen = stateOf(c) === 'open'; }
  function boot() {
    if (adminS()) show('admin', {}, 'replace'); else show('entry', {}, 'replace');
    Bosla.init({ render: onRender, endpoint: CFG.endpoint, onResponse });
    const p = new URLSearchParams(location.search);
    if (!p.get('t') && !p.get('r')) api('copy').catch(() => {});
  }
  if (window.BoslaReady) window.BoslaReady.then(boot); else boot(); // الوضع المحلي يجهّز خادمه أولًا
})();

</script>
</body>
